# compose サンプル: otel-logger をサイドカーとして起動し、別コンテナで動く
# Claude Code / Codex からの OTLP telemetry を受ける。
#
# 使い方:
#   docker compose up otel-logger              # receiver だけ起動する
#   docker compose run --rm claude-code-sample # 1 回限りの CLI job を実行する
#   docker compose run --rm codex-sample       # telemetry 有効の Codex を実行する
#
# telemetry は otel-logger の stdout (docker compose logs) と、
# 欠落のない JSON Lines として ./data/otel-logger.jsonl に出力される。

services:
  otel-logger:
    build:
      context: .
      dockerfile: Dockerfile
    image: otel-logger:dev
    ports:
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
    volumes:
      # JSONL 出力ディレクトリ。既定は repo に含まれる ./data。
      # 環境ごとの差し替えは .env で行う: OTEL_LOGGER_DATA_DIR=/absolute/path
      - ${OTEL_LOGGER_DATA_DIR:-./data}:/var/log/otel-logger
    command:
      - --grpc-addr
      - 0.0.0.0:4317
      - --http-addr
      - 0.0.0.0:4318
      # 日次ローテーション JSONL: volume 内に otel-logger.YYYY-MM-DD を書く。
      # --log-keep-days より古いファイルは起動時とローテーション時に削除される。
      - --log-dir
      - /var/log/otel-logger
      - --log-keep-days
      - "10"
      - --color
      - never
    healthcheck:
      test: ["CMD", "/usr/local/bin/otel-logger", "--dry-run"]
      interval: 10s
      timeout: 3s
      retries: 3

  # サンプル: telemetry を otel-logger へ送る Claude Code 実行コンテナ。
  # 実運用では prompt や project mount を用途に合わせて置き換える。
  claude-code-sample:
    image: node:20-bookworm-slim
    depends_on:
      otel-logger:
        condition: service_started
    environment:
      # Claude Code telemetry を有効化するために必須。
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"

      # signal ごとの OTLP exporter を選ぶ。Logs+metrics は GA、
      # traces は下の BETA flag が必要。
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: "1"

      # port 4318 の HTTP/protobuf で otel-logger へ送る。
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-logger:4318

      # receiver が telemetry を正しく識別できるよう run に tag を付ける。
      OTEL_RESOURCE_ATTRIBUTES: "service.name=claude-code,service.namespace=ci,deployment.environment=ci"
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eux
        npm install -g @anthropic-ai/claude-code
        # 実際の Claude Code 起動コマンドに置き換える。
        claude --version

  # サンプル: Codex CLI 実行コンテナ。Codex は env vars ではなく config.toml の
  # [otel] を契約にするため、./codex-config の設定ファイルを mount する。
  codex-sample:
    image: node:20-bookworm-slim
    depends_on:
      otel-logger:
        condition: service_started
    environment:
      CODEX_HOME: /root/.codex
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./codex-config:/root/.codex:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eux
        npm install -g @openai/codex
        codex --version
