[package]
name = "otel-logger"
version = "26.7.100"
edition = "2024"
rust-version = "1.88"
description = "OTLP receiver that logs Claude Code / Codex telemetry to stdout and JSONL"
license = "MIT"
repository = "https://github.com/owayo/otel-logger"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "ci", "claude-code", "codex"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "otel_logger"
path = "src/lib.rs"

[[bin]]
name = "otel-logger"
path = "src/main.rs"

[dependencies]
# OTLP 型と gRPC service trait (proto drift を避けるため単一の真実として使う)
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
    "gen-tonic",
    "trace",
    "metrics",
    "logs",
    "with-serde",
] }

# gRPC 関連。`channel` を明示的に含めて OTLP proxy 転送 (client 側) にも使う。
# TLS は webpki-roots を採用し、追加のシステム依存を抱えないビルドにする。
tonic = { version = "0.14.6", default-features = false, features = [
    "server",
    "router",
    "transport",
    "channel",
    "codegen",
    "tls-ring",
    "tls-webpki-roots",
] }
tonic-prost = "0.14.6"
prost = "0.14.4"

# HTTP 関連
axum = { version = "0.8.9", default-features = false, features = [
    "tokio",
    "http1",
    "http2",
    "json",
    "matched-path",
    "original-uri",
    "query",
] }
bytes = "1.12.1"
http = "1.4.2"
# OTLP/HTTP protobuf での proxy 転送で使う HTTP client。
# rustls + プラットフォームの証明書検証 + http2 に絞って余計な依存を抱えない。
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
] }

# 非同期 runtime
tokio = { version = "1.53.0", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
] }
tokio-util = "0.7.18"

# CLI
clap = { version = "4.6.2", features = ["derive", "env"] }

# シリアライズ / 出力
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"

# その他
anyhow = "1.0.103"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
is-terminal = "0.4.17"

# JSONL 出力の日次ローテーション (claw-hooks と揃える)。
logroller = "0.1.12"

[dev-dependencies]
tempfile = "3.27.0"
# HTTP router の body size 制限テストで `ServiceExt::oneshot` を使う。
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
