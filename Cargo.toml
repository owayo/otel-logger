[package]
name = "otel-logger"
version = "26.5.104"
edition = "2024"
rust-version = "1.88"
description = "OTLP receiver that logs Claude Code / Codex telemetry to stdout and JSONL"
license = "MIT"
repository = "https://github.com/owayo/otel-logger"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "ci", "claude-code", "codex"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "otel_logger"
path = "src/lib.rs"

[[bin]]
name = "otel-logger"
path = "src/main.rs"

[dependencies]
# OTLP 型と gRPC service trait (proto drift を避けるため単一の真実として使う)
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [
    "gen-tonic",
    "trace",
    "metrics",
    "logs",
    "with-serde",
] }

# gRPC 関連
tonic = { version = "0.14.6", default-features = false, features = [
    "server",
    "router",
    "transport",
    "codegen",
] }
tonic-prost = "0.14.6"
prost = "0.14.3"

# HTTP 関連
axum = { version = "0.8.9", default-features = false, features = [
    "tokio",
    "http1",
    "http2",
    "json",
    "matched-path",
    "original-uri",
    "query",
] }
bytes = "1.11.1"
http = "1.4.1"

# 非同期 runtime
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
] }
tokio-util = "0.7.18"

# CLI
clap = { version = "4.6.1", features = ["derive", "env"] }

# シリアライズ / 出力
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# その他
anyhow = "1.0.102"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
is-terminal = "0.4.17"

# JSONL 出力の日次ローテーション (claw-hooks と揃える)。
logroller = "0.1.10"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
