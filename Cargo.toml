[package]
name = "otel-logger"
version = "26.9.100"
edition = "2024"
rust-version = "1.99"
description = "OTLP receiver that logs Claude Code / Codex telemetry to stdout and JSONL"
license = "MIT"
repository = "https://github.com/owayo/otel-logger"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "ci", "claude-code", "codex"]
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "otel_logger"
path = "src/lib.rs"

[[bin]]
name = "otel-logger"
path = "src/main.rs"

[dependencies]
# OTLP 型と gRPC service trait (proto drift を避けるため単一の真実として使う)
opentelemetry-proto = { version = "0.33.1", default-features = false, features = [
    "gen-tonic",
    "trace",
    "metrics",
    "logs",
    "with-serde",
] }

# gRPC 関連。`channel` を明示的に含めて OTLP proxy 転送 (client 側) にも使う。
# TLS は webpki-roots を採用し、追加のシステム依存を抱えないビルドにする。
tonic = { version = "0.14.6", default-features = false, features = [
    "server",
    "router",
    "transport",
    "channel",
    "codegen",
    # `OTEL_EXPORTER_OTLP_COMPRESSION=gzip` の exporter は gRPC でも body を圧縮して送る。
    # 受け付けないと handler 到達前に `Unimplemented` (非 retryable) になり batch が失われる。
    "gzip",
    "tls-ring",
    "tls-webpki-roots",
] }
tonic-prost = "0.14.6"
prost = "0.14.4"

# HTTP 関連
axum = { version = "0.8.9", default-features = false, features = [
    "tokio",
    "http1",
    "http2",
    "json",
    "matched-path",
    "original-uri",
    "query",
] }
bytes = "1.12.1"
http = "1.5.0"
# 受信 body の読み取り (axum の `to_bytes` が返す上限超過の判定) と、gRPC の body の期限切れを
# retryable な Status へ変換するのに使う。
http-body-util = "0.1.5"
httpdate = "1.0.3"
# OTLP/HTTP client は body を gzip して送ってよい (`Content-Encoding: gzip`)。
# 解凍しないと protobuf decode に失敗して 400 を返し、OTLP 仕様上 400 は retry 禁止
# なので batch がそのまま失われる。
# `timeout` は gRPC の受信 body に、受け付けからの絶対期限 (`DeadlineBody`) を掛けるのに使う。
tower-http = { version = "0.7.1", default-features = false, features = [
    "decompression-gzip",
    "timeout",
] }
# gRPC の受信上限を tonic の Server へ layer として挟むための trait (`Layer` / `Service`)。
tower = { version = "0.5.3", default-features = false }
# OTLP/HTTP protobuf での proxy 転送で使う HTTP client。
# rustls + プラットフォームの証明書検証 + http2 に絞って余計な依存を抱えない。
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "gzip",
] }

# 非同期 runtime
tokio = { version = "1.53.3", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "fs",
    "io-util",
    "net",
    # proxy worker の retry backoff と shutdown の grace period で `tokio::time` を使う。
    # 依存経由 (reqwest 等) でしか有効になっていないと、その構成が変わった瞬間に
    # ビルドできなくなる。
    "time",
] }
tokio-util = "0.7.20"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# シリアライズ / 出力
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# その他
anyhow = "1.0.104"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
is-terminal = "0.4.17"

# 日次ファイルは書き込み時のローカル暦日で切り替える。
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.27.0"
# gzip した OTLP/HTTP request を受け付けられることの回帰テストで使う。
flate2 = "1.1.10"
# HTTP router の body size 制限テストで `ServiceExt::oneshot` を使う。
tower = { version = "0.5.3", features = ["util"] }
# 受信の期限のテストで tokio の時計を止めて進める (`start_paused`)。
tokio = { version = "1.53.3", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
